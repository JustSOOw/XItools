# XItools生产环境Docker配置 - furdow.com服务器
version: '3.8'

services:
  xitools-postgres:
    image: postgres:14
    container_name: xitools-postgres
    restart: always
    environment:
      POSTGRES_USER: xitools_user
      POSTGRES_PASSWORD: ${XITOOLS_DB_PASSWORD}
      POSTGRES_DB: xitools
    ports:
      - "5433:5432"  # 避免与现有服务冲突
    volumes:
      - xitools_pg_data:/var/lib/postgresql/data
    networks:
      - xitools-network

  xitools-backend:
    build: ./backend
    container_name: xitools-backend
    restart: always
    ports:
      - "3001:3000"  # 避免与Flask后端5000端口冲突
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://xitools_user:${XITOOLS_DB_PASSWORD}@xitools-postgres:5432/xitools
      - PORT=3000
      - HOST=0.0.0.0
      - CORS_ORIGINS=https://xitools.furdow.com,http://localhost:*
    depends_on:
      - xitools-postgres
    networks:
      - xitools-network

volumes:
  xitools_pg_data:

networks:
  xitools-network:
