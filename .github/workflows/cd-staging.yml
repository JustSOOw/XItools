# XItools 预生产环境部署工作流
# 用于预生产环境的部署和验证

name: 预生产环境部署

on:
  push:
    branches: [ develop ]
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: '部署分支'
        required: true
        default: 'develop'
        type: string
      skip_tests:
        description: '跳过测试'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '20.x'
  STAGING_PORT: 8081

jobs:
  # 预部署检查
  pre-deploy-check:
    name: 预部署检查
    runs-on: ubuntu-latest
    
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      version: ${{ steps.version.outputs.version }}
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.deploy_branch || 'develop' }}
        fetch-depth: 0
        
    - name: 检查部署条件
      id: check
      run: |
        echo "🔍 检查部署条件..."
        
        # 检查是否有代码更改
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          echo "should_deploy=true" >> $GITHUB_OUTPUT
          echo "🚀 手动触发部署"
        else
          # 检查最近提交的更改
          if git diff --name-only HEAD~1 HEAD | grep -E '\.(js|ts|jsx|tsx|json|yml|yaml)$' > /dev/null; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ 检测到代码更改，准备部署"
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "ℹ️ 未检测到需要部署的更改"
          fi
        fi
        
    - name: 生成版本号
      id: version
      run: |
        VERSION=staging-$(date +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "📦 版本号: $VERSION"

  # 快速测试
  quick-test:
    name: 快速测试
    runs-on: ubuntu-latest
    needs: [pre-deploy-check]
    if: needs.pre-deploy-check.outputs.should_deploy == 'true' && github.event.inputs.skip_tests != 'true'
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.deploy_branch || 'develop' }}
        
    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          backend/package-lock.json
          
    - name: 安装依赖
      run: |
        cd frontend && npm ci
        cd ../backend && npm ci
        
    - name: 快速代码检查
      run: |
        cd frontend && npm run lint --if-present
        cd ../backend && npm run lint --if-present
        
    - name: 快速构建测试
      run: |
        cd frontend && npm run build
        cd ../backend && npm run build
        
    - name: 单元测试
      run: |
        cd backend && npm run test:unit --if-present

  # 构建镜像
  build-staging:
    name: 构建预生产镜像
    runs-on: ubuntu-latest
    needs: [pre-deploy-check, quick-test]
    if: always() && needs.pre-deploy-check.outputs.should_deploy == 'true' && (needs.quick-test.result == 'success' || needs.quick-test.result == 'skipped')
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.deploy_branch || 'develop' }}
        
    - name: 设置 Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: 登录 GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: 构建并推送前端镜像
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        target: production
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/frontend:staging
          ghcr.io/${{ github.repository }}/frontend:${{ needs.pre-deploy-check.outputs.version }}
        cache-from: type=gha,scope=staging-frontend
        cache-to: type=gha,mode=max,scope=staging-frontend
        
    - name: 构建并推送后端镜像
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        target: production
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/backend:staging
          ghcr.io/${{ github.repository }}/backend:${{ needs.pre-deploy-check.outputs.version }}
        cache-from: type=gha,scope=staging-backend
        cache-to: type=gha,mode=max,scope=staging-backend

  # 部署到预生产环境
  deploy-staging:
    name: 部署到预生产环境
    runs-on: ubuntu-latest
    needs: [pre-deploy-check, build-staging]
    environment: staging
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.deploy_branch || 'develop' }}
        
    - name: 设置 SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        
    - name: 准备预生产环境
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
        # 创建预生产目录
        mkdir -p /opt/xitools-staging/releases/${{ needs.pre-deploy-check.outputs.version }}
        mkdir -p /opt/xitools-staging/shared/logs
        mkdir -p /opt/xitools-staging/shared/data
        EOF
        
    - name: 上传部署文件
      run: |
        # 创建预生产环境配置
        cp docker-compose.prod.yml docker-compose.staging.yml
        
        # 修改端口配置避免与生产环境冲突
        sed -i 's/8080:80/8081:80/g' docker-compose.staging.yml
        sed -i 's/5432:5432/5433:5432/g' docker-compose.staging.yml
        
        # 上传配置文件
        scp -o StrictHostKeyChecking=no docker-compose.staging.yml ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/xitools-staging/releases/${{ needs.pre-deploy-check.outputs.version }}/docker-compose.prod.yml
        scp -o StrictHostKeyChecking=no nginx/xitools-docker.conf ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/xitools-staging/releases/${{ needs.pre-deploy-check.outputs.version }}/
        
        # 创建预生产环境变量
        cat > .env.staging << EOF
        NODE_ENV=staging
        DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/xitools_staging
        JWT_SECRET=${{ secrets.JWT_SECRET }}
        POSTGRES_USER=${{ secrets.POSTGRES_USER }}
        POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
        POSTGRES_DB=xitools_staging
        VITE_BACKEND_URL=http://xitools.furdow.com:8081/api
        CORS_ORIGINS=http://xitools.furdow.com:8081
        EOF
        
        scp -o StrictHostKeyChecking=no .env.staging ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/xitools-staging/releases/${{ needs.pre-deploy-check.outputs.version }}/.env.production
        
    - name: 执行部署
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
        cd /opt/xitools-staging
        
        echo "🚀 开始部署预生产环境版本 ${{ needs.pre-deploy-check.outputs.version }}"
        
        # 停止当前服务
        if [ -f current/docker-compose.prod.yml ]; then
          echo "⏹️ 停止当前预生产服务..."
          docker-compose -f current/docker-compose.prod.yml down || true
        fi
        
        # 切换到新版本
        ln -sfn releases/${{ needs.pre-deploy-check.outputs.version }} current
        
        # 启动新服务
        cd current
        echo "🔄 启动预生产服务..."
        docker-compose -f docker-compose.prod.yml pull
        docker-compose -f docker-compose.prod.yml up -d
        
        echo "✅ 预生产服务启动完成"
        EOF
        
    - name: 等待服务启动
      run: |
        echo "⏳ 等待预生产服务启动..."
        sleep 45

  # 预生产环境验证
  verify-staging:
    name: 预生产环境验证
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 基础健康检查
      run: |
        echo "🏥 执行预生产环境健康检查..."
        
        MAX_RETRIES=15
        RETRY_INTERVAL=10
        
        for i in $(seq 1 $MAX_RETRIES); do
          if curl -f -s --connect-timeout 10 "http://xitools.furdow.com:${{ env.STAGING_PORT }}/" > /dev/null; then
            echo "✅ 前端健康检查通过 (尝试 $i/$MAX_RETRIES)"
            break
          else
            echo "⏳ 前端健康检查失败，等待重试... ($i/$MAX_RETRIES)"
            if [ $i -eq $MAX_RETRIES ]; then
              echo "❌ 前端健康检查最终失败"
              exit 1
            fi
            sleep $RETRY_INTERVAL
          fi
        done
        
        # 检查后端API
        for i in $(seq 1 $MAX_RETRIES); do
          if curl -f -s --connect-timeout 10 "http://xitools.furdow.com:${{ env.STAGING_PORT }}/api/health" > /dev/null; then
            echo "✅ 后端API健康检查通过 (尝试 $i/$MAX_RETRIES)"
            break
          else
            echo "⏳ 后端API健康检查失败，等待重试... ($i/$MAX_RETRIES)"
            if [ $i -eq $MAX_RETRIES ]; then
              echo "❌ 后端API健康检查最终失败"
              exit 1
            fi
            sleep $RETRY_INTERVAL
          fi
        done
        
    - name: 功能验证
      run: |
        echo "🧪 执行功能验证..."
        
        # 检查关键功能端点
        ENDPOINTS=(
          "http://xitools.furdow.com:${{ env.STAGING_PORT }}/"
          "http://xitools.furdow.com:${{ env.STAGING_PORT }}/api/health"
        )
        
        for endpoint in "${ENDPOINTS[@]}"; do
          echo "检查端点: $endpoint"
          if response=$(curl -s --connect-timeout 10 "$endpoint"); then
            echo "✅ $endpoint 响应正常"
          else
            echo "❌ $endpoint 响应异常"
            exit 1
          fi
        done
        
    - name: 性能基准测试
      run: |
        echo "📊 执行性能基准测试..."
        
        # 简单的响应时间测试
        RESPONSE_TIME=$(curl -w "%{time_total}" -o /dev/null -s "http://xitools.furdow.com:${{ env.STAGING_PORT }}/")
        echo "首页响应时间: ${RESPONSE_TIME}s"
        
        # 检查响应时间是否合理（小于5秒）
        if (( $(echo "$RESPONSE_TIME < 5.0" | bc -l) )); then
          echo "✅ 响应时间正常"
        else
          echo "⚠️ 响应时间较慢: ${RESPONSE_TIME}s"
        fi

  # 清理旧版本
  cleanup-staging:
    name: 清理预生产环境
    runs-on: ubuntu-latest
    needs: [verify-staging]
    if: needs.verify-staging.result == 'success'
    
    steps:
    - name: 设置 SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        
    - name: 清理操作
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
        cd /opt/xitools-staging/releases
        
        # 保留最近3个版本
        echo "🧹 清理预生产环境旧版本（保留最近3个）..."
        ls -t | tail -n +4 | xargs -r rm -rf
        
        # 清理未使用的Docker镜像
        docker image prune -f > /dev/null 2>&1 || true
        
        echo "✅ 清理完成"
        EOF

  # 部署通知
  notify:
    name: 部署通知
    runs-on: ubuntu-latest
    needs: [pre-deploy-check, deploy-staging, verify-staging]
    if: always() && needs.pre-deploy-check.outputs.should_deploy == 'true'
    
    steps:
    - name: 发送通知
      run: |
        if [[ "${{ needs.verify-staging.result }}" == "success" ]]; then
          STATUS="✅ 成功"
          COLOR="good"
          MESSAGE="预生产环境部署成功"
        else
          STATUS="❌ 失败"
          COLOR="danger"
          MESSAGE="预生产环境部署失败"
        fi
        
        echo "📢 预生产部署通知"
        echo "状态: $STATUS"
        echo "版本: ${{ needs.pre-deploy-check.outputs.version }}"
        echo "分支: ${{ github.event.inputs.deploy_branch || 'develop' }}"
        echo "访问地址: http://xitools.furdow.com:${{ env.STAGING_PORT }}"
        echo "部署时间: $(date)"
        echo "消息: $MESSAGE"
        
        # 如果配置了 Slack Webhook，发送通知
        if [[ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]]; then
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"XItools 预生产环境部署 $STATUS\n版本: ${{ needs.pre-deploy-check.outputs.version }}\n分支: ${{ github.event.inputs.deploy_branch || 'develop' }}\n访问: http://xitools.furdow.com:${{ env.STAGING_PORT }}\n$MESSAGE\"}" \
            ${{ secrets.SLACK_WEBHOOK_URL }} || echo "Slack通知发送失败"
        fi
