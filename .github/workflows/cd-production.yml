# XItools 生产环境部署工作流
# 简化版生产部署，专注于安全可靠的部署

name: 生产环境部署

on:
  pull_request:
    branches: [ main ]
    types: [ closed ]
  workflow_dispatch:

# 添加必要的权限以支持GitHub Container Registry
permissions:
  contents: read
  packages: write
  id-token: write

env:
  NODE_VERSION: '20.x'

jobs:
  # 生产环境部署
  deploy-production:
    name: 部署到生产环境
    runs-on: ubuntu-latest
    environment: production
    # 只在PR合并到main分支时触发，禁止直接push部署
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 生成版本号
      id: version
      run: |
        VERSION=prod-$(date +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "📦 版本号: $VERSION"

    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          backend/package-lock.json

    - name: 构建验证
      run: |
        echo "🏗️ 生产构建验证..."
        cd frontend && npm ci
        echo "📝 复制Web版本TypeScript配置..."
        cp tsconfig.web.json tsconfig.json
        echo "🔨 构建前端（Web版本）..."
        npx vite build
        cd ../backend && npm ci && npm run build
        echo "✅ 构建验证完成"

    - name: 构建并推送镜像
      run: |
        echo "🐳 构建生产环境 Docker 镜像..."

        # 登录到GitHub Container Registry
        echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

        # 将仓库名称转换为小写以符合GitHub Container Registry要求
        REPO_LOWERCASE=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        echo "📦 使用镜像仓库: ghcr.io/${REPO_LOWERCASE}"

        # 构建前端镜像
        echo "🔨 构建前端镜像..."
        docker build -t ghcr.io/${REPO_LOWERCASE}/frontend:latest ./frontend --target production

        # 构建后端镜像
        echo "🔨 构建后端镜像..."
        docker build -t ghcr.io/${REPO_LOWERCASE}/backend:latest ./backend --target production

        # 推送前端镜像
        echo "📤 推送前端镜像..."
        docker push ghcr.io/${REPO_LOWERCASE}/frontend:latest

        # 推送后端镜像
        echo "📤 推送后端镜像..."
        docker push ghcr.io/${REPO_LOWERCASE}/backend:latest

        echo "✅ 镜像构建和推送完成"


    - name: 设置 SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: 部署到生产服务器
      run: |
        echo "🚀 开始部署到生产环境..."

        # 创建部署目录
        ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
        mkdir -p /opt/xitools/releases/${{ steps.version.outputs.version }}
        mkdir -p /opt/xitools/shared
        EOF

        # 准备配置文件
        cat > .env.production << EOF
        NODE_ENV=production
        DATABASE_URL=${{ secrets.DATABASE_URL }}
        JWT_SECRET=${{ secrets.JWT_SECRET }}
        POSTGRES_USER=${{ secrets.POSTGRES_USER }}
        POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
        POSTGRES_DB=${{ secrets.POSTGRES_DB }}
        VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_URL }}
        CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
        EOF

        # 上传文件
        echo "📤 上传部署文件..."
        scp -o StrictHostKeyChecking=no docker-compose.prod.yml ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/xitools/releases/${{ steps.version.outputs.version }}/
        scp -o StrictHostKeyChecking=no .env.production ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/xitools/releases/${{ steps.version.outputs.version }}/
        scp -r -o StrictHostKeyChecking=no nginx/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/xitools/releases/${{ steps.version.outputs.version }}/

        # 验证文件上传完整性
        echo "🔍 验证文件上传完整性..."
        ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'VERIFY_EOF'
        cd /opt/xitools/releases/${{ steps.version.outputs.version }}

        # 检查必需文件
        REQUIRED_FILES=("docker-compose.prod.yml" ".env.production" "nginx/xitools-docker.conf")
        for file in "${REQUIRED_FILES[@]}"; do
          if [ ! -f "$file" ]; then
            echo "❌ 缺少必需文件: $file"
            exit 1
          fi
          echo "✅ 文件存在: $file"
        done

        # 验证配置文件语法
        echo "🔍 验证Docker Compose配置语法..."
        docker compose -f docker-compose.prod.yml config > /dev/null || docker-compose -f docker-compose.prod.yml config > /dev/null
        if [ $? -eq 0 ]; then
          echo "✅ Docker Compose配置语法正确"
        else
          echo "❌ Docker Compose配置语法错误"
          exit 1
        fi

        echo "✅ 文件上传完整性验证通过"
        VERIFY_EOF

        # 执行部署
        ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
        cd /opt/xitools

        # 基础设施检查和修复
        echo "🔍 执行基础设施检查..."

        # 检查Docker服务状态
        if ! systemctl is-active --quiet docker; then
          echo "启动Docker服务..."
          systemctl start docker
          sleep 5
        fi

        # 检查Docker daemon连接
        if ! docker info > /dev/null 2>&1; then
          echo "重启Docker服务..."
          systemctl restart docker
          sleep 10
          if ! docker info > /dev/null 2>&1; then
            echo "❌ Docker daemon连接失败"
            exit 1
          fi
        fi

        # 配置Docker镜像加速器（如果需要）
        if [ ! -f /etc/docker/daemon.json ]; then
          echo "配置Docker镜像加速器..."
          mkdir -p /etc/docker
          echo '{"registry-mirrors":["https://docker.1ms.run","https://docker.xuanyuan.me"],"dns":["8.8.8.8","114.114.114.114"]}' > /etc/docker/daemon.json
          systemctl restart docker
          sleep 10
        fi

        echo "✅ 基础设施检查完成"

        # 停止当前服务
        if [ -f current/docker-compose.prod.yml ]; then
          docker compose -f current/docker-compose.prod.yml down || docker-compose -f current/docker-compose.prod.yml down || true
        fi

        # 登录到GitHub Container Registry
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

        # 切换到新版本
        ln -sfn releases/${{ steps.version.outputs.version }} current
        cd current

        # 验证配置文件
        echo "验证Docker Compose配置..."
        docker compose -f docker-compose.prod.yml config || docker-compose -f docker-compose.prod.yml config

        # 拉取最新镜像
        echo "拉取最新镜像..."
        docker compose -f docker-compose.prod.yml pull || docker-compose -f docker-compose.prod.yml pull

        # 启动服务
        echo "启动服务..."
        docker compose -f docker-compose.prod.yml up -d || docker-compose -f docker-compose.prod.yml up -d

        # 验证容器启动状态
        echo "🔍 验证容器启动状态..."
        sleep 10  # 等待容器启动

        # 检查所有容器是否正在运行
        EXPECTED_CONTAINERS=("xitools-postgres-prod" "xitools-backend-prod" "xitools-frontend-prod" "xitools-nginx-prod")
        FAILED_CONTAINERS=()

        for container in "${EXPECTED_CONTAINERS[@]}"; do
          if docker ps --format "table {{.Names}}" | grep -q "^${container}$"; then
            echo "✅ 容器运行正常: $container"
          else
            echo "❌ 容器未运行: $container"
            FAILED_CONTAINERS+=("$container")
          fi
        done

        # 如果有容器启动失败，显示详细信息并退出
        if [ ${#FAILED_CONTAINERS[@]} -gt 0 ]; then
          echo "❌ 以下容器启动失败: ${FAILED_CONTAINERS[*]}"
          echo "📋 显示容器状态和日志..."
          docker compose -f docker-compose.prod.yml ps || docker-compose -f docker-compose.prod.yml ps

          for container in "${FAILED_CONTAINERS[@]}"; do
            echo "📋 容器 $container 的日志:"
            docker logs $container --tail 20 2>&1 || echo "无法获取容器日志"
          done

          exit 1
        fi

        # 显示容器状态
        echo "📊 所有容器状态："
        docker compose -f docker-compose.prod.yml ps || docker-compose -f docker-compose.prod.yml ps

        # 清理旧镜像
        docker image prune -f

        echo "✅ 生产环境部署完成，所有容器正常运行"
        EOF

    - name: 全面健康检查
      run: |
        echo "🏥 执行全面健康检查..."

        # 等待服务完全启动
        echo "⏳ 等待服务完全启动..."
        sleep 45

        # 检查容器健康状态
        echo "🔍 检查容器健康状态..."
        ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'HEALTH_EOF'
        cd /opt/xitools/current

        # 检查容器健康状态
        UNHEALTHY_CONTAINERS=()
        for container in xitools-postgres-prod xitools-backend-prod xitools-frontend-prod xitools-nginx-prod; do
          health=$(docker inspect --format='{{.State.Health.Status}}' $container 2>/dev/null || echo "no-healthcheck")
          status=$(docker inspect --format='{{.State.Status}}' $container 2>/dev/null || echo "not-found")

          if [ "$status" = "running" ]; then
            if [ "$health" = "healthy" ] || [ "$health" = "no-healthcheck" ]; then
              echo "✅ $container: $status ($health)"
            else
              echo "❌ $container: $status ($health)"
              UNHEALTHY_CONTAINERS+=("$container")
            fi
          else
            echo "❌ $container: $status"
            UNHEALTHY_CONTAINERS+=("$container")
          fi
        done

        if [ ${#UNHEALTHY_CONTAINERS[@]} -gt 0 ]; then
          echo "❌ 发现不健康的容器: ${UNHEALTHY_CONTAINERS[*]}"
          exit 1
        fi
        HEALTH_EOF

        # 检查应用可访问性
        echo "🌐 检查应用可访问性..."
        HEALTH_CHECK_FAILED=false

        # 检查前端
        for i in {1..12}; do
          if curl -f -s --connect-timeout 10 "https://xitools.furdow.com/" > /dev/null; then
            echo "✅ 前端应用可访问"
            break
          else
            echo "⏳ 等待前端应用启动... ($i/12)"
            if [ $i -eq 12 ]; then
              echo "❌ 前端应用健康检查失败"
              HEALTH_CHECK_FAILED=true
            fi
            sleep 10
          fi
        done

        # 检查后端API
        for i in {1..12}; do
          if curl -f -s --connect-timeout 10 "https://xitools.furdow.com/api/health" > /dev/null; then
            echo "✅ 后端API可访问"
            break
          else
            echo "⏳ 等待后端API启动... ($i/12)"
            if [ $i -eq 12 ]; then
              echo "❌ 后端API健康检查失败"
              HEALTH_CHECK_FAILED=true
            fi
            sleep 10
          fi
        done

        # 如果健康检查失败，标记部署失败
        if [ "$HEALTH_CHECK_FAILED" = true ]; then
          echo "❌ 健康检查失败，部署被标记为失败"
          echo "📋 获取失败诊断信息..."
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'DIAG_EOF'
          cd /opt/xitools/current
          echo "容器状态："
          docker compose -f docker-compose.prod.yml ps || docker-compose -f docker-compose.prod.yml ps
          echo "容器日志（最近20行）："
          docker compose -f docker-compose.prod.yml logs --tail 20 || docker-compose -f docker-compose.prod.yml logs --tail 20
          DIAG_EOF
          exit 1
        fi

        echo "✅ 所有健康检查通过，部署成功"

    - name: 自动回滚处理
      if: failure()
      run: |
        echo "🔄 检测到部署失败，执行自动回滚..."

        ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ROLLBACK_EOF'
        cd /opt/xitools

        # 查找上一个版本
        PREVIOUS_VERSION=$(ls -1t releases/ | grep -v "$(readlink current | sed 's/releases\///')" | head -1)

        if [ -n "$PREVIOUS_VERSION" ] && [ -d "releases/$PREVIOUS_VERSION" ]; then
          echo "🔄 回滚到上一个版本: $PREVIOUS_VERSION"

          # 停止当前失败的服务
          if [ -f current/docker-compose.prod.yml ]; then
            docker compose -f current/docker-compose.prod.yml down || docker-compose -f current/docker-compose.prod.yml down || true
          fi

          # 切换到上一个版本
          ln -sfn releases/$PREVIOUS_VERSION current
          cd current

          # 启动上一个版本的服务
          docker compose -f docker-compose.prod.yml up -d || docker-compose -f docker-compose.prod.yml up -d

          echo "✅ 回滚完成，服务已恢复到上一个稳定版本"
        else
          echo "⚠️ 没有找到可回滚的版本"
        fi
        ROLLBACK_EOF

        echo "❌ 部署失败，已尝试自动回滚"
        exit 1

    - name: 部署完成通知
      if: always()
      run: |
        echo "📢 生产环境部署完成"
        echo "版本: ${{ steps.version.outputs.version }}"
        echo "分支: ${{ github.ref_name }}"
        echo "访问地址: https://xitools.furdow.com"
        echo "部署时间: $(date)"
