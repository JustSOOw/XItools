# XItools 生产环境部署工作流
# 简化版生产部署，专注于安全可靠的部署

name: 生产环境部署

on:
  pull_request:
    branches: [ main ]
    types: [ closed ]
  workflow_dispatch:

# 添加必要的权限以支持GitHub Container Registry
permissions:
  contents: read
  packages: write
  id-token: write

env:
  NODE_VERSION: '20.x'

jobs:
  # 生产环境部署
  deploy-production:
    name: 部署到生产环境
    runs-on: ubuntu-latest
    environment: production
    # 只在PR合并到main分支时触发，禁止直接push部署
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 生成版本号
      id: version
      run: |
        VERSION=prod-$(date +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "📦 版本号: $VERSION"

    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          backend/package-lock.json

    - name: 构建验证
      run: |
        echo "🏗️ 生产构建验证..."
        cd frontend && npm ci
        echo "📝 复制Web版本TypeScript配置..."
        cp tsconfig.web.json tsconfig.json
        echo "🔨 构建前端（Web版本）..."
        npx vite build
        cd ../backend && npm ci && npm run build
        echo "✅ 构建验证完成"

    - name: 构建并推送镜像
      run: |
        echo "🐳 构建生产环境 Docker 镜像..."

        # 登录到GitHub Container Registry
        echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

        # 将仓库名称转换为小写以符合GitHub Container Registry要求
        REPO_LOWERCASE=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        echo "📦 使用镜像仓库: ghcr.io/${REPO_LOWERCASE}"

        # 拉取并推送基础镜像到GitHub Container Registry
        echo "📥 拉取基础镜像..."
        docker pull postgres:14
        docker pull nginx:alpine

        echo "🏷️ 重新标记基础镜像..."
        docker tag postgres:14 ghcr.io/${REPO_LOWERCASE}/postgres:14
        docker tag nginx:alpine ghcr.io/${REPO_LOWERCASE}/nginx:alpine

        echo "📤 推送基础镜像..."
        docker push ghcr.io/${REPO_LOWERCASE}/postgres:14
        docker push ghcr.io/${REPO_LOWERCASE}/nginx:alpine

        # 构建前端镜像
        echo "🔨 构建前端镜像..."
        docker build -t ghcr.io/${REPO_LOWERCASE}/frontend:latest ./frontend --target production

        # 构建后端镜像
        echo "🔨 构建后端镜像..."
        docker build -t ghcr.io/${REPO_LOWERCASE}/backend:latest ./backend --target production

        # 推送前端镜像
        echo "📤 推送前端镜像..."
        docker push ghcr.io/${REPO_LOWERCASE}/frontend:latest

        # 推送后端镜像
        echo "📤 推送后端镜像..."
        docker push ghcr.io/${REPO_LOWERCASE}/backend:latest

        echo "✅ 镜像构建和推送完成"


    - name: 设置 SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: 部署到生产服务器
      run: |
        echo "🚀 开始部署到生产环境..."

        # 创建部署目录
        ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
        mkdir -p /opt/xitools/releases/${{ steps.version.outputs.version }}
        mkdir -p /opt/xitools/shared
        EOF

        # 准备配置文件
        cat > .env.production << EOF
        NODE_ENV=production
        DATABASE_URL=${{ secrets.DATABASE_URL }}
        JWT_SECRET=${{ secrets.JWT_SECRET }}
        POSTGRES_USER=${{ secrets.POSTGRES_USER }}
        POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
        POSTGRES_DB=${{ secrets.POSTGRES_DB }}
        VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_URL }}
        CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
        EOF

        # 上传文件
        echo "📤 上传部署文件..."
        scp -o StrictHostKeyChecking=no docker-compose.prod.yml ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/xitools/releases/${{ steps.version.outputs.version }}/
        scp -o StrictHostKeyChecking=no .env.production ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/xitools/releases/${{ steps.version.outputs.version }}/
        scp -r -o StrictHostKeyChecking=no nginx/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/xitools/releases/${{ steps.version.outputs.version }}/

        # 检查SSL证书并配置nginx
        echo "� 检查SSL证书并配置nginx..."
        ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'SSL_CONFIG_EOF'
        cd /opt/xitools/releases/${{ steps.version.outputs.version }}

        # 检查SSL证书是否存在
        SSL_AVAILABLE=false

        # 首先检查xitools.furdow.com的专用证书
        if [ -f "/etc/letsencrypt/live/xitools.furdow.com/fullchain.pem" ] && [ -f "/etc/letsencrypt/live/xitools.furdow.com/privkey.pem" ]; then
          echo "✅ xitools.furdow.com SSL证书文件存在"
          CERT_PATH="/etc/letsencrypt/live/xitools.furdow.com"

          # 检查证书是否即将过期（30天内）
          if openssl x509 -checkend 2592000 -noout -in "$CERT_PATH/fullchain.pem"; then
            echo "✅ SSL证书有效期充足"
            SSL_AVAILABLE=true
          else
            echo "⚠️ SSL证书即将过期，需要续期"
            SSL_AVAILABLE=false
          fi

        # 如果没有专用证书，检查通配符证书
        elif [ -f "/etc/letsencrypt/live/furdow.com/fullchain.pem" ] && [ -f "/etc/letsencrypt/live/furdow.com/privkey.pem" ]; then
          echo "✅ 发现furdow.com通配符证书"
          CERT_PATH="/etc/letsencrypt/live/furdow.com"

          # 检查证书是否支持xitools.furdow.com
          if openssl x509 -in "$CERT_PATH/fullchain.pem" -text -noout | grep -E "(DNS:.*xitools\.furdow\.com|DNS:\*\.furdow\.com)"; then
            echo "✅ 通配符证书支持xitools.furdow.com"
            SSL_AVAILABLE=true
          else
            echo "⚠️ 现有证书不支持xitools.furdow.com，需要生成新证书"
            SSL_AVAILABLE=false
          fi

        else
          echo "⚠️ 未找到任何SSL证书文件"
          SSL_AVAILABLE=false
        fi

        # 如果SSL证书不可用，尝试自动生成
        if [ "$SSL_AVAILABLE" = false ]; then
          echo "🔒 开始自动生成SSL证书..."

          # 安装certbot（如果未安装）
          if ! command -v certbot &> /dev/null; then
            echo "📦 安装certbot..."
            apt-get update
            apt-get install -y certbot
          fi

          # 确保nginx未占用80端口（用于证书验证）
          if netstat -tlnp | grep :80 > /dev/null; then
            echo "🛑 停止占用80端口的服务..."
            fuser -k 80/tcp || true
            sleep 5
          fi

          # 创建webroot目录
          mkdir -p /var/www/certbot

          # 创建临时nginx配置用于证书验证
          echo "🔧 创建临时nginx配置用于证书验证..."
          cat > /etc/nginx/sites-available/temp-certbot << 'TEMP_NGINX_EOF'
server {
    listen 80;
    server_name xitools.furdow.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 200 'Certificate verification in progress...';
        add_header Content-Type text/plain;
    }
}
TEMP_NGINX_EOF

          # 启用临时配置
          ln -sf /etc/nginx/sites-available/temp-certbot /etc/nginx/sites-enabled/temp-certbot

          # 安装并启动nginx（如果未运行）
          if ! command -v nginx &> /dev/null; then
            apt-get install -y nginx
          fi

          # 测试并重载nginx配置
          if nginx -t; then
            systemctl reload nginx || systemctl restart nginx
          fi

          # 使用webroot模式生成证书
          echo "🔐 为 xitools.furdow.com 生成SSL证书..."
          if certbot certonly \
            --webroot \
            --webroot-path=/var/www/certbot \
            --email ${{ secrets.SSL_EMAIL || 'admin@furdow.com' }} \
            --agree-tos \
            --no-eff-email \
            --domains xitools.furdow.com \
            --non-interactive; then

            echo "✅ SSL证书生成成功"
            SSL_AVAILABLE=true
            CERT_PATH="/etc/letsencrypt/live/xitools.furdow.com"

            # 清理临时nginx配置
            rm -f /etc/nginx/sites-enabled/temp-certbot
            rm -f /etc/nginx/sites-available/temp-certbot

            # 设置证书自动续期
            if ! crontab -l | grep -q "certbot renew"; then
              echo "⏰ 设置证书自动续期..."
              (crontab -l 2>/dev/null; echo "0 12 * * * /usr/bin/certbot renew --quiet --deploy-hook 'docker restart xitools-nginx-prod'") | crontab -
            fi

          else
            echo "❌ SSL证书生成失败，将使用HTTP模式"
            echo "  可能的原因："
            echo "  1. 域名DNS未正确指向此服务器"
            echo "  2. 防火墙阻止了80端口访问"
            echo "  3. Let's Encrypt服务暂时不可用"
            SSL_AVAILABLE=false
          fi
        fi

        # 根据SSL证书可用性选择nginx配置
        if [ "$SSL_AVAILABLE" = true ]; then
          echo "🔧 配置HTTPS模式的nginx..."
          # 创建支持HTTPS的nginx配置
          cat > nginx/xitools-prod-ssl.conf << NGINX_SSL_EOF
# XItools 生产环境 Nginx 配置 (HTTPS模式)
upstream backend_servers {
    server backend:3000;
    keepalive 32;
}

upstream frontend_servers {
    server frontend:80;
    keepalive 16;
}

# HTTP服务器 - 重定向到HTTPS
server {
    listen 80;
    server_name xitools.furdow.com;

    # Let's Encrypt验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # 重定向到HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS服务器
server {
    listen 443 ssl http2;
    server_name xitools.furdow.com;

    # SSL配置
    ssl_certificate ${CERT_PATH}/fullchain.pem;
    ssl_certificate_key ${CERT_PATH}/privkey.pem;

    # SSL安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全头部
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 文件上传大小限制
    client_max_body_size 1024M;

    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # API代理到后端服务
    location /api/ {
        proxy_pass http://backend_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # WebSocket代理
    location /socket.io/ {
        proxy_pass http://backend_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }

    # MCP服务代理
    location /mcp {
        proxy_pass http://backend_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # 后端健康检查
    location /health {
        proxy_pass http://backend_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端静态文件
    location / {
        proxy_pass http://frontend_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 错误页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
NGINX_SSL_EOF

          # 使用HTTPS配置
          cp nginx/xitools-prod-ssl.conf nginx/xitools-docker.conf

          # 添加443端口映射到docker-compose.prod.yml
          sed -i '/- "80:80"/a\      - "443:443"   # HTTPS端口' docker-compose.prod.yml

          echo "✅ 已配置HTTPS模式"
        else
          echo "🔧 使用HTTP模式的nginx配置..."
          echo "✅ 已配置HTTP模式（仅80端口）"
        fi

        # 确保certbot验证目录存在
        mkdir -p /var/www/certbot

        echo "✅ Nginx配置完成"
        SSL_CONFIG_EOF

        # 验证文件上传完整性
        echo "🔍 验证文件上传完整性..."
        ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'VERIFY_EOF'
        cd /opt/xitools/releases/${{ steps.version.outputs.version }}

        # 检查必需文件
        REQUIRED_FILES=("docker-compose.prod.yml" ".env.production" "nginx/xitools-docker.conf")
        for file in "${REQUIRED_FILES[@]}"; do
          if [ ! -f "$file" ]; then
            echo "❌ 缺少必需文件: $file"
            exit 1
          fi
          echo "✅ 文件存在: $file"
        done

        # 验证配置文件语法
        echo "🔍 验证Docker Compose配置语法..."
        docker compose -f docker-compose.prod.yml config > /dev/null || docker-compose -f docker-compose.prod.yml config > /dev/null
        if [ $? -eq 0 ]; then
          echo "✅ Docker Compose配置语法正确"
        else
          echo "❌ Docker Compose配置语法错误"
          exit 1
        fi

        echo "✅ 文件上传完整性验证通过"
        VERIFY_EOF

        # 执行部署
        ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
        cd /opt/xitools

        # 基础设施检查
        echo "🔍 执行基础设施检查..."

        # 检查Docker服务状态
        if ! systemctl is-active --quiet docker; then
          echo "启动Docker服务..."
          systemctl start docker
          sleep 5
        fi

        # 检查Docker daemon连接
        if ! docker info > /dev/null 2>&1; then
          echo "重启Docker服务..."
          systemctl restart docker
          sleep 10
          if ! docker info > /dev/null 2>&1; then
            echo "❌ Docker daemon连接失败"
            exit 1
          fi
        fi

        echo "✅ 基础设施检查完成"

        # 检查端口占用情况
        echo "� 检查端口占用情况..."
        if netstat -tlnp | grep :80 > /dev/null; then
          echo "⚠️ 端口80已被占用，停止占用进程..."
          fuser -k 80/tcp || true
        fi

        if netstat -tlnp | grep :443 > /dev/null; then
          echo "⚠️ 端口443已被占用，停止占用进程..."
          fuser -k 443/tcp || true
        fi

        # 停止当前服务
        if [ -f current/docker-compose.prod.yml ]; then
          docker compose -f current/docker-compose.prod.yml down || docker-compose -f current/docker-compose.prod.yml down || true
        fi

        # 登录到GitHub Container Registry
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

        # 切换到新版本
        ln -sfn releases/${{ steps.version.outputs.version }} current
        cd current

        # 验证配置文件
        echo "验证Docker Compose配置..."
        docker compose -f docker-compose.prod.yml config || docker-compose -f docker-compose.prod.yml config

        # 拉取最新镜像
        echo "拉取最新镜像..."
        docker compose -f docker-compose.prod.yml pull || docker-compose -f docker-compose.prod.yml pull

        # 启动服务
        echo "启动服务..."
        docker compose -f docker-compose.prod.yml up -d || docker-compose -f docker-compose.prod.yml up -d

        # 验证容器启动状态（初步检查）
        echo "🔍 验证容器启动状态..."
        sleep 15  # 给容器更多启动时间

        # 检查所有容器状态（包括restarting状态）
        EXPECTED_CONTAINERS=("xitools-postgres-prod" "xitools-backend-prod" "xitools-frontend-prod" "xitools-nginx-prod")
        CRITICAL_FAILED_CONTAINERS=()

        echo "📊 容器启动状态检查:"
        for container in "${EXPECTED_CONTAINERS[@]}"; do
          status=$(docker inspect --format='{{.State.Status}}' $container 2>/dev/null || echo "not-found")
          restart_count=$(docker inspect --format='{{.RestartCount}}' $container 2>/dev/null || echo "0")

          case "$status" in
            "running")
              echo "✅ $container: 运行中 (重启次数: $restart_count)"
              ;;
            "restarting")
              echo "🔄 $container: 重启中 (重启次数: $restart_count)"
              if [[ "$container" == *"nginx"* ]]; then
                echo "   Nginx容器重启是正常的，可能在加载SSL配置"
              fi
              ;;
            "exited")
              exit_code=$(docker inspect --format='{{.State.ExitCode}}' $container 2>/dev/null || echo "unknown")
              echo "❌ $container: 已退出 (退出码: $exit_code, 重启次数: $restart_count)"
              CRITICAL_FAILED_CONTAINERS+=("$container")
              ;;
            "not-found")
              echo "❌ $container: 容器不存在"
              CRITICAL_FAILED_CONTAINERS+=("$container")
              ;;
            *)
              echo "⚠️ $container: 状态 $status (重启次数: $restart_count)"
              ;;
          esac
        done

        # 只有在容器完全无法启动时才退出（不包括restarting状态）
        if [ ${#CRITICAL_FAILED_CONTAINERS[@]} -gt 0 ]; then
          echo "❌ 以下容器启动严重失败: ${CRITICAL_FAILED_CONTAINERS[*]}"
          echo "📋 显示容器状态和日志..."
          docker compose -f docker-compose.prod.yml ps || docker-compose -f docker-compose.prod.yml ps

          for container in "${CRITICAL_FAILED_CONTAINERS[@]}"; do
            echo "📋 容器 $container 的日志:"
            docker logs $container --tail 30 2>&1 || echo "无法获取容器日志"
          done

          exit 1
        fi

        echo "✅ 容器初步启动检查完成，将在后续进行详细健康检查"

        # 显示容器状态
        echo "📊 所有容器状态："
        docker compose -f docker-compose.prod.yml ps || docker-compose -f docker-compose.prod.yml ps

        # 清理旧镜像
        docker image prune -f

        echo "✅ 生产环境部署完成，所有容器正常运行"
        EOF

    - name: 全面健康检查
      run: |
        echo "🏥 执行全面健康检查..."

        # 等待服务完全启动
        echo "⏳ 等待服务完全启动..."
        echo "  给予容器足够的启动时间，特别是Nginx容器需要加载SSL配置..."
        sleep 90

        # 检查容器健康状态（带重试机制）
        echo "🔍 检查容器健康状态..."
        ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'HEALTH_EOF'
        cd /opt/xitools/current

        # 定义容器检查函数
        check_container_health() {
          local container=$1
          local max_retries=6
          local retry_interval=10

          for ((i=1; i<=max_retries; i++)); do
            echo "🔍 检查 $container 状态 (尝试 $i/$max_retries)..."

            health=$(docker inspect --format='{{.State.Health.Status}}' $container 2>/dev/null || echo "no-healthcheck")
            status=$(docker inspect --format='{{.State.Status}}' $container 2>/dev/null || echo "not-found")
            restart_count=$(docker inspect --format='{{.RestartCount}}' $container 2>/dev/null || echo "0")

            echo "  状态: $status, 健康: $health, 重启次数: $restart_count"

            # 检查容器状态
            case "$status" in
              "running")
                if [ "$health" = "healthy" ] || [ "$health" = "no-healthcheck" ]; then
                  echo "✅ $container: 运行正常 ($status, $health)"
                  return 0
                else
                  echo "⚠️ $container: 运行中但健康检查失败 ($status, $health)"
                fi
                ;;
              "restarting")
                echo "🔄 $container: 正在重启中，等待启动完成..."
                # 对于nginx容器，给予更多耐心
                if [[ "$container" == *"nginx"* ]]; then
                  echo "  Nginx容器需要更长时间加载SSL配置，继续等待..."
                fi
                ;;
              "exited")
                exit_code=$(docker inspect --format='{{.State.ExitCode}}' $container 2>/dev/null || echo "unknown")
                echo "❌ $container: 已退出 (退出码: $exit_code)"
                # 显示容器日志
                echo "📋 容器日志 (最近10行):"
                docker logs --tail 10 $container 2>&1 || echo "无法获取日志"
                return 1
                ;;
              "not-found")
                echo "❌ $container: 容器不存在"
                return 1
                ;;
              *)
                echo "⚠️ $container: 未知状态 ($status)"
                ;;
            esac

            # 如果不是最后一次尝试，等待后重试
            if [ $i -lt $max_retries ]; then
              echo "  等待 ${retry_interval} 秒后重试..."
              sleep $retry_interval
            fi
          done

          # 所有重试都失败
          echo "❌ $container: 健康检查失败，已达到最大重试次数"
          echo "📋 最终状态: $status, 健康: $health, 重启次数: $restart_count"

          # 显示详细的容器信息
          echo "📋 容器详细信息:"
          docker inspect $container --format='{{json .State}}' 2>/dev/null | jq '.' 2>/dev/null || docker inspect $container --format='{{.State}}' 2>/dev/null || echo "无法获取容器信息"

          # 显示容器日志
          echo "📋 容器日志 (最近20行):"
          docker logs --tail 20 $container 2>&1 || echo "无法获取日志"

          return 1
        }

        # 检查所有容器
        FAILED_CONTAINERS=()
        CONTAINERS=("xitools-postgres-prod" "xitools-backend-prod" "xitools-frontend-prod" "xitools-nginx-prod")

        for container in "${CONTAINERS[@]}"; do
          if ! check_container_health "$container"; then
            FAILED_CONTAINERS+=("$container")
          fi
        done

        # 检查是否有失败的容器
        if [ ${#FAILED_CONTAINERS[@]} -gt 0 ]; then
          echo "❌ 以下容器健康检查失败: ${FAILED_CONTAINERS[*]}"

          # 显示所有容器的当前状态
          echo "📊 所有容器当前状态:"
          docker compose -f docker-compose.prod.yml ps || docker-compose -f docker-compose.prod.yml ps

          exit 1
        fi

        echo "✅ 所有容器健康检查通过"

        # 检查端口监听状态
        echo "🔌 检查端口监听状态..."
        echo "HTTP端口80:"
        netstat -tlnp | grep :80 || echo "⚠️ 端口80未监听"

        echo "HTTPS端口443:"
        netstat -tlnp | grep :443 || echo "⚠️ 端口443未监听"

        # 检查本地连通性
        echo "🔗 检查本地连通性..."
        if curl -f -s --connect-timeout 5 "http://127.0.0.1/health" > /dev/null; then
          echo "✅ HTTP端口可访问"
        else
          echo "⚠️ HTTP端口不可访问，尝试HTTPS..."
          if curl -f -s -k --connect-timeout 5 "https://127.0.0.1/health" > /dev/null; then
            echo "✅ HTTPS端口可访问"
          else
            echo "❌ 本地健康检查失败，无法访问应用"
          fi
        fi

        HEALTH_EOF

        # 检查应用可访问性
        echo "🌐 检查应用可访问性..."
        HEALTH_CHECK_FAILED=false

        # 检查前端（先尝试HTTPS，再尝试HTTP）
        echo "检查前端应用可访问性..."
        FRONTEND_ACCESSIBLE=false

        # 尝试HTTPS访问
        for i in {1..6}; do
          if curl -f -s --connect-timeout 10 "https://xitools.furdow.com/" > /dev/null; then
            echo "✅ 前端应用HTTPS可访问"
            FRONTEND_ACCESSIBLE=true
            break
          else
            echo "⏳ 等待前端HTTPS启动... ($i/6)"
            sleep 10
          fi
        done

        # 如果HTTPS失败，尝试HTTP
        if [ "$FRONTEND_ACCESSIBLE" = false ]; then
          echo "HTTPS访问失败，尝试HTTP..."
          for i in {1..6}; do
            if curl -f -s --connect-timeout 10 "http://xitools.furdow.com/" > /dev/null; then
              echo "✅ 前端应用HTTP可访问"
              FRONTEND_ACCESSIBLE=true
              break
            else
              echo "⏳ 等待前端HTTP启动... ($i/6)"
              sleep 10
            fi
          done
        fi

        if [ "$FRONTEND_ACCESSIBLE" = false ]; then
          echo "❌ 前端应用健康检查失败（HTTPS和HTTP都无法访问）"
          HEALTH_CHECK_FAILED=true
        fi

        # 检查后端API（先尝试HTTPS，再尝试HTTP）
        echo "检查后端API可访问性..."
        API_ACCESSIBLE=false

        # 尝试HTTPS访问
        for i in {1..6}; do
          if curl -f -s --connect-timeout 10 "https://xitools.furdow.com/api/health" > /dev/null; then
            echo "✅ 后端API HTTPS可访问"
            API_ACCESSIBLE=true
            break
          else
            echo "⏳ 等待后端API HTTPS启动... ($i/6)"
            sleep 10
          fi
        done

        # 如果HTTPS失败，尝试HTTP
        if [ "$API_ACCESSIBLE" = false ]; then
          echo "HTTPS访问失败，尝试HTTP..."
          for i in {1..6}; do
            if curl -f -s --connect-timeout 10 "http://xitools.furdow.com/api/health" > /dev/null; then
              echo "✅ 后端API HTTP可访问"
              API_ACCESSIBLE=true
              break
            else
              echo "⏳ 等待后端API HTTP启动... ($i/6)"
              sleep 10
            fi
          done
        fi

        if [ "$API_ACCESSIBLE" = false ]; then
          echo "❌ 后端API健康检查失败（HTTPS和HTTP都无法访问）"
          HEALTH_CHECK_FAILED=true
        fi

        # 如果健康检查失败，标记部署失败
        if [ "$HEALTH_CHECK_FAILED" = true ]; then
          echo "❌ 健康检查失败，部署被标记为失败"
          echo "📋 获取失败诊断信息..."
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'DIAG_EOF'
          cd /opt/xitools/current
          echo "容器状态："
          docker compose -f docker-compose.prod.yml ps || docker-compose -f docker-compose.prod.yml ps
          echo "容器日志（最近20行）："
          docker compose -f docker-compose.prod.yml logs --tail 20 || docker-compose -f docker-compose.prod.yml logs --tail 20
          DIAG_EOF
          exit 1
        fi

        echo "✅ 所有健康检查通过，部署成功"

    - name: 自动回滚处理
      if: failure()
      run: |
        echo "🔄 检测到部署失败，执行自动回滚..."

        ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ROLLBACK_EOF'
        cd /opt/xitools

        # 查找上一个版本
        PREVIOUS_VERSION=$(ls -1t releases/ | grep -v "$(readlink current | sed 's/releases\///')" | head -1)

        if [ -n "$PREVIOUS_VERSION" ] && [ -d "releases/$PREVIOUS_VERSION" ]; then
          echo "🔄 回滚到上一个版本: $PREVIOUS_VERSION"

          # 停止当前失败的服务
          if [ -f current/docker-compose.prod.yml ]; then
            docker compose -f current/docker-compose.prod.yml down || docker-compose -f current/docker-compose.prod.yml down || true
          fi

          # 切换到上一个版本
          ln -sfn releases/$PREVIOUS_VERSION current
          cd current

          # 启动上一个版本的服务
          docker compose -f docker-compose.prod.yml up -d || docker-compose -f docker-compose.prod.yml up -d

          echo "✅ 回滚完成，服务已恢复到上一个稳定版本"
        else
          echo "⚠️ 没有找到可回滚的版本"
        fi
        ROLLBACK_EOF

        echo "❌ 部署失败，已尝试自动回滚"
        exit 1

    - name: 部署完成通知
      if: always()
      run: |
        echo "📢 生产环境部署完成"
        echo "版本: ${{ steps.version.outputs.version }}"
        echo "分支: ${{ github.ref_name }}"
        echo "访问地址: https://xitools.furdow.com"
        echo "部署时间: $(date)"
