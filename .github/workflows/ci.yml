# XItools 持续集成工作流
# 简化版CI配置，专注于代码质量检查和构建验证

name: 持续集成 (CI)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

jobs:
  # 代码质量检查和构建
  build-and-check:
    name: 代码检查和构建
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          backend/package-lock.json

    - name: 安装前端依赖
      working-directory: ./frontend
      run: npm ci

    - name: 安装后端依赖
      working-directory: ./backend
      run: npm ci

    - name: 前端代码检查
      working-directory: ./frontend
      run: |
        echo "🔍 执行前端代码检查..."
        npm run lint
        npm run type-check

    - name: 后端代码检查
      working-directory: ./backend
      run: |
        echo "🔍 执行后端代码检查..."
        npm run lint
        npm run type-check

    - name: 代码格式检查
      run: |
        echo "📝 检查代码格式..."
        cd frontend && npm run format:check
        cd ../backend && npm run format:check


    - name: 前端构建测试
      working-directory: ./frontend
      run: |
        echo "🏗️ 构建前端应用..."
        npm run build

    - name: 后端构建测试
      working-directory: ./backend
      run: |
        echo "🏗️ 构建后端应用..."
        npm run build

    - name: 基础安全检查
      run: |
        echo "🔒 执行基础安全检查..."
        cd frontend && npm audit --audit-level=high --production || echo "⚠️ 前端发现安全警告"
        cd ../backend && npm audit --audit-level=high --production || echo "⚠️ 后端发现安全警告"


    - name: Docker 构建验证
      if: github.event_name == 'pull_request'
      run: |
        echo "🐳 验证 Docker 构建..."
        docker build -t xitools-frontend:test ./frontend --target production
        docker build -t xitools-backend:test ./backend --target production
        echo "✅ Docker 构建验证完成"

    - name: CI 状态汇总
      if: always()
      run: |
        echo "📊 CI 流水线完成"
        echo "分支: ${{ github.ref_name }}"
        echo "提交: ${{ github.sha }}"
        echo "✅ 代码检查和构建验证通过"
