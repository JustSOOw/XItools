# XItools 持续集成工作流
# 负责代码质量检查、构建和测试

name: 持续集成 (CI)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  CACHE_VERSION: v1

jobs:
  # 代码质量检查
  code-quality:
    name: 代码质量检查
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          backend/package-lock.json
          
    - name: 安装前端依赖
      working-directory: ./frontend
      run: npm install

    - name: 安装后端依赖
      working-directory: ./backend
      run: npm install
      
    - name: 前端代码检查
      working-directory: ./frontend
      run: |
        npm run lint || echo "前端代码检查发现问题，继续执行"
        npm run type-check || echo "前端类型检查发现问题，继续执行"

    - name: 后端代码检查
      working-directory: ./backend
      run: |
        npm run lint || echo "后端代码检查发现问题，继续执行"
        npm run type-check || echo "后端类型检查发现问题，继续执行"
        
    - name: 代码格式检查
      run: |
        cd frontend && npm run format:check || echo "前端格式检查发现问题，继续执行"
        cd ../backend && npm run format:check || echo "后端格式检查发现问题，继续执行"

  # 安全扫描
  security-scan:
    name: 安全扫描
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 运行 CodeQL 分析
      uses: github/codeql-action/init@v3
      with:
        languages: javascript, typescript
        
    - name: 执行 CodeQL 分析
      uses: github/codeql-action/analyze@v3
      
    - name: 依赖漏洞扫描
      run: |
        cd frontend && npm audit --audit-level=critical || echo "前端发现非严重漏洞，继续执行"
        cd ../backend && npm audit --audit-level=critical || echo "后端发现非严重漏洞，继续执行"

  # 构建测试
  build-test:
    name: 构建和测试
    runs-on: ubuntu-latest
    needs: [code-quality]
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          backend/package-lock.json
          
    - name: 安装依赖
      run: |
        cd frontend && npm ci
        cd ../backend && npm ci
        
    - name: 设置测试环境变量
      run: |
        echo "DATABASE_URL=postgresql://test_user:test_password@localhost:5432/test_db" >> $GITHUB_ENV
        echo "JWT_SECRET=test-jwt-secret-key-for-ci" >> $GITHUB_ENV
        echo "NODE_ENV=test" >> $GITHUB_ENV
        
    - name: 数据库迁移
      working-directory: ./backend
      run: |
        npx prisma generate
        npx prisma db push
        
    - name: 后端构建
      working-directory: ./backend
      run: npm run build
      
    - name: 前端构建
      working-directory: ./frontend
      run: npm run build
      
    - name: 后端单元测试
      working-directory: ./backend
      run: npm run test:unit
      
    - name: 后端集成测试
      working-directory: ./backend
      run: npm run test:integration
      
    - name: 前端单元测试
      working-directory: ./frontend
      run: npm run test:unit
      
    - name: 上传测试覆盖率
      uses: codecov/codecov-action@v4
      with:
        files: |
          ./frontend/coverage/lcov.info
          ./backend/coverage/lcov.info
        fail_ci_if_error: false

  # Docker 构建测试
  docker-build:
    name: Docker 构建测试
    runs-on: ubuntu-latest
    needs: [build-test]
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置 Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: 构建前端镜像
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        target: production
        push: false
        tags: xitools-frontend:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: 构建后端镜像
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        target: production
        push: false
        tags: xitools-backend:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: 运行 Docker 安全扫描
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: xitools-frontend:test
        format: 'sarif'
        output: 'trivy-frontend-results.sarif'
        
    - name: 上传安全扫描结果
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-frontend-results.sarif'

  # 端到端测试
  e2e-test:
    name: 端到端测试
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'pull_request'
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: 安装 Playwright
      working-directory: ./frontend
      run: |
        npm ci
        npx playwright install --with-deps
        
    - name: 启动测试环境
      run: |
        docker-compose -f docker-compose.dev.yml up -d
        sleep 30
        
    - name: 运行 E2E 测试
      working-directory: ./frontend
      run: npm run test:e2e
      
    - name: 上传测试报告
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 7
        
    - name: 清理测试环境
      if: always()
      run: docker-compose -f docker-compose.dev.yml down

  # 构建状态汇总
  ci-status:
    name: CI 状态汇总
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan, build-test, docker-build]
    if: always()
    
    steps:
    - name: 检查 CI 状态
      run: |
        if [[ "${{ needs.code-quality.result }}" == "success" && 
              "${{ needs.security-scan.result }}" == "success" && 
              "${{ needs.build-test.result }}" == "success" && 
              "${{ needs.docker-build.result }}" == "success" ]]; then
          echo "✅ 所有 CI 检查通过"
          echo "CI_STATUS=success" >> $GITHUB_ENV
        else
          echo "❌ CI 检查失败"
          echo "CI_STATUS=failure" >> $GITHUB_ENV
          exit 1
        fi
        
    - name: 通知状态
      if: always()
      run: |
        echo "CI 流水线完成"
        echo "状态: ${{ env.CI_STATUS }}"
        echo "分支: ${{ github.ref_name }}"
        echo "提交: ${{ github.sha }}"
