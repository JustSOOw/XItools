<!-- MCP工具图标 - 表示12+个MCP工具接口 -->
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 工具箱主体 -->
  <rect x="3" y="6" width="14" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.8"/>
  
  <!-- 工具箱手柄 -->
  <path d="M 7 6 L 7 4 Q 7 3 8 3 L 12 3 Q 13 3 13 4 L 13 6" 
        stroke="currentColor" stroke-width="1.2" fill="none" opacity="0.8"/>
  
  <!-- 工具箱分隔 -->
  <line x1="3" y1="9" x2="17" y2="9" stroke="currentColor" stroke-width="0.8" opacity="0.6"/>
  
  <!-- MCP工具图标 -->
  <!-- 工具1: get_task_schema -->
  <rect x="5" y="7" width="1.5" height="1.5" rx="0.2" fill="currentColor" opacity="0.9"/>
  
  <!-- 工具2: submit_task_dataset -->
  <rect x="7" y="7" width="1.5" height="1.5" rx="0.2" fill="currentColor" opacity="0.8"/>
  
  <!-- 工具3: list_tasks -->
  <rect x="9" y="7" width="1.5" height="1.5" rx="0.2" fill="currentColor" opacity="0.7"/>
  
  <!-- 工具4: get_task_details -->
  <rect x="11" y="7" width="1.5" height="1.5" rx="0.2" fill="currentColor" opacity="0.9"/>
  
  <!-- 工具5: update_task -->
  <rect x="13" y="7" width="1.5" height="1.5" rx="0.2" fill="currentColor" opacity="0.8"/>
  
  <!-- 工具6: delete_task -->
  <rect x="15" y="7" width="1.5" height="1.5" rx="0.2" fill="currentColor" opacity="0.7"/>
  
  <!-- 下层工具 -->
  <rect x="5" y="10" width="1.5" height="1.5" rx="0.2" fill="currentColor" opacity="0.6"/>
  <rect x="7" y="10" width="1.5" height="1.5" rx="0.2" fill="currentColor" opacity="0.8"/>
  <rect x="9" y="10" width="1.5" height="1.5" rx="0.2" fill="currentColor" opacity="0.7"/>
  <rect x="11" y="10" width="1.5" height="1.5" rx="0.2" fill="currentColor" opacity="0.9"/>
  <rect x="13" y="10" width="1.5" height="1.5" rx="0.2" fill="currentColor" opacity="0.6"/>
  <rect x="15" y="10" width="1.5" height="1.5" rx="0.2" fill="currentColor" opacity="0.8"/>
  
  <!-- 底层工具 -->
  <rect x="5" y="12.5" width="1.5" height="1.5" rx="0.2" fill="currentColor" opacity="0.7"/>
  <rect x="7" y="12.5" width="1.5" height="1.5" rx="0.2" fill="currentColor" opacity="0.5"/>
  <rect x="9" y="12.5" width="1.5" height="1.5" rx="0.2" fill="currentColor" opacity="0.8"/>
  <rect x="11" y="12.5" width="1.5" height="1.5" rx="0.2" fill="currentColor" opacity="0.6"/>
  
  <!-- 工具活动指示器 -->
  <circle cx="16" cy="5" r="1" fill="currentColor" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="16" y="5.5" text-anchor="middle" font-size="0.6" fill="currentColor" opacity="0.9">12</text>
  
  <!-- 连接线表示工具间的协作 -->
  <path d="M 5.75 8.75 L 7.75 7.75" stroke="currentColor" stroke-width="0.3" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M 9.75 8.75 L 11.75 7.75" stroke="currentColor" stroke-width="0.3" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite" begin="1s"/>
  </path>
  <path d="M 13.75 8.75 L 15.75 7.75" stroke="currentColor" stroke-width="0.3" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite" begin="2s"/>
  </path>
</svg>
